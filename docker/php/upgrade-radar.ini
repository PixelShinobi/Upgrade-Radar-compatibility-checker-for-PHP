; PHP settings for the local WordPress in docker-compose.yml.
;
; They mirror a locked-down shared host, so every manual test runs under the
; limits Upgrade Radar has to survive in the wild: no process functions and a
; 30-second time limit per request.
disable_functions = exec,passthru,pcntl_exec,popen,proc_open,shell_exec,system
max_execution_time = 30
memory_limit = 128M
