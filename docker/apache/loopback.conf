# The site URL is http://localhost:8080, so WordPress's requests to itself
# (WP-Cron, Site Health's loopback test) go to port 8080 inside the container
# too. Serve the site there as well, so WP-Cron runs as it does on a real host.
Listen 8080

<VirtualHost *:8080>
	DocumentRoot /var/www/html
</VirtualHost>
