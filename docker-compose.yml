# Throwaway WordPress for manual tests.
#
#   docker compose up -d     WordPress at http://localhost:8080
#   docker compose run --rm cli wp core install --url=http://localhost:8080 \
#     --title="Upgrade Radar dev" --admin_user=admin --admin_password=admin \
#     --admin_email=admin@example.com --skip-email
#   docker compose down -v   remove everything, including the database
#
# The repo is mounted read-only as wp-content/plugins/upgrade-radar, and
# docker/php/upgrade-radar.ini disables exec() and friends and sets a 30-second
# max_execution_time, like a locked-down host. docker/apache/loopback.conf lets
# WordPress reach itself at its own URL, so WP-Cron works. Set WORDPRESS_TAG to
# try another PHP version, for example WORDPRESS_TAG=php8.1-apache.

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${WORDPRESS_TAG:-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      <<: *wordpress-env
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/upgrade-radar:ro
      - ./docker/php/upgrade-radar.ini:/usr/local/etc/php/conf.d/zz-upgrade-radar.ini:ro
      - ./docker/apache/loopback.conf:/etc/apache2/conf-enabled/zz-upgrade-radar-loopback.conf:ro

  # WP-CLI, only started on demand: docker compose run --rm cli wp ...
  cli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wordpress-env
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/upgrade-radar:ro
      - ./docker/php/upgrade-radar.ini:/usr/local/etc/php/conf.d/zz-upgrade-radar.ini:ro

volumes:
  db:
  wordpress:
